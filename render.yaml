services:
  - type: web
    name: codesentinel
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_NAME
        value: CodeSentinel
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        value: sqlite:///./codesentinel.db
      - key: AI_PROVIDER
        value: mock

